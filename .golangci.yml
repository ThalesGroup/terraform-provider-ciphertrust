version: "2"
linters:
  default: none
  enable:
    - durationcheck      # detects incorrect time.Duration arithmetic (e.g. multiplying two durations)
    - errcheck           # ensures returned errors are checked and not silently discarded
    - godot              # enforces that top-level comments end with a period
    - govet              # reports suspicious constructs caught by the official go vet tool
    - ineffassign        # detects assignments whose value is never subsequently used
    - makezero           # finds make() calls that create slices with a non-zero initial length
    - misspell           # catches commonly misspelled English words in comments and strings
    - nilerr             # flags functions that return a nil error alongside a non-nil value
    - predeclared        # warns when identifiers shadow Go predeclared names (e.g. len, error)
    - staticcheck        # comprehensive suite of static analysis checks (replaces gosimple)
    - unconvert          # removes redundant explicit type conversions
    - unused             # reports unexported identifiers (types, funcs, vars) that are never used
  settings:
    staticcheck:
      checks:
        - all
        # QF* are staticcheck's "quickfix" family: editor-oriented refactor hints
        # (tagged switches, De Morgan rewrites, merged declarations) rather than
        # correctness checks. They are disabled as a CI gate because the suggested
        # rewrites are cosmetic and some span hundreds of lines of re-indentation.
        - -QF1003        # "could use tagged switch": would re-indent the ~670-line opType chain in resource_cte_clientgroup.go
        - -QF1007        # "could merge conditional assignment into declaration": breaks up parallel, commented check blocks
        # Defaults carried over from golangci-lint; re-listed because setting
        # `checks` replaces the default list rather than extending it.
        - -ST1000        # missing package comment
        - -ST1003        # naming conventions (conflicts with API-mirroring field names like ResourceSetId)
        - -ST1016        # inconsistent receiver names
        - -ST1020        # comment on exported function
        - -ST1021        # comment on exported type
        - -ST1022        # comment on exported variable
  exclusions:
    generated: lax       # apply a relaxed standard to generated files rather than skipping them entirely
    presets:
      - comments               # suppresses comment-formatting false positives (e.g. godot on special comments)
      - common-false-positives # suppresses well-known false positives across many linters
      - legacy                 # suppresses issues that only apply to pre-module or pre-1.18 code patterns
      - std-error-handling     # suppresses opinionated standard-library error-handling warnings
    paths:
      - third_party$  # skip vendored third-party code
      - builtin$      # skip generated built-in stubs
      - examples$     # skip example code
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt              # enforces canonical Go source formatting (replaces the old gofmt linter)
  exclusions:
    generated: lax
    paths:
      - third_party$  # skip vendored third-party code
      - builtin$      # skip generated built-in stubs
      - examples$     # skip example code
