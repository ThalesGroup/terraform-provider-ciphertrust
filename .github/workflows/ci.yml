name: Go Checks
on:
  push:
    branches:
      - "**"
  pull_request:
permissions:
  contents: read
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt -s formatted:"
            echo "$unformatted"
            echo
            echo "Run 'make fmt' and commit the result."
            exit 1
          fi
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Plan-only resource.UnitTest cases drive the real terraform CLI against
      # the in-process provider, so a binary must be on PATH.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Run unit tests
        run: make unit
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Dependency CVEs reached through go.mod / go.sum. Blocking: a HIGH or
      # CRITICAL finding that has a fix available fails the job. Unfixed CVEs
      # are reported by the step below rather than blocking a merge nobody can
      # unblock.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      # Report-only for now. docs/, examples/ and sample-scripts/ carry
      # placeholder PEM blocks and service-account JSON that the secret scanner
      # is likely to flag; triage the first run, add a .trivyignore for the
      # placeholders, then switch exit-code to "1".
      - name: Trivy secret scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "0"
          format: table
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.0
